name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          # Opcional, mas recomendado para o cache:
          run_install: false # Não roda 'pnpm install' aqui
          cache: true # Habilita o cache gerido pela action do pnpm

      # 3. Agora você pode instalar as dependências
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint -- --no-interactive --no-cache

      - name: Build
        run: pnpm build